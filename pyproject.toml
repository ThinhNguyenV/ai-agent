[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-media-agent"
version = "0.1.0"
description = "FastAPI AI agent for on-demand image and video generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0"
]
local = [
  "accelerate>=0.33.0",
  "diffusers>=0.35.0",
  "ftfy>=6.2.0",
  "imageio[ffmpeg]>=2.34.0",
  "sentencepiece>=0.2.0",
  "torch>=2.4.0",
  "transformers>=4.44.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]